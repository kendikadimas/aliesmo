name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # FTP hang, HTTPS bot wall, UAPI extract missing, multipart upload hang.
      # Text files: Fileman/save_file_content (fast). Binary: upload_files.
      - name: Deploy via cPanel UAPI save_file_content
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, sys, urllib.parse, urllib.request, ssl
          from pathlib import Path

          host = os.environ["CPANEL_HOST"].replace("https://", "").replace("http://", "").split("/")[0].split(":")[0]
          user = os.environ["CPANEL_USERNAME"]
          token = os.environ["CPANEL_API_TOKEN"]
          auth = f"cpanel {user}:{token}"
          base = f"https://{host}:2083/execute"
          ctx = ssl.create_default_context()

          def call(module_func, params=None, timeout=30):
              url = f"{base}/{module_func}"
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              req = urllib.request.Request(url, headers={"Authorization": auth})
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  return json.loads(r.read().decode())

          def post_multipart(module_func, fields, files, timeout=60):
              """fields: dict, files: list of (field, filename, bytes, content_type)"""
              import uuid
              boundary = uuid.uuid4().hex
              body = bytearray()
              for k, v in fields.items():
                  body.extend(f"--{boundary}\r\n".encode())
                  body.extend(f'Content-Disposition: form-data; name="{k}"\r\n\r\n'.encode())
                  body.extend(str(v).encode())
                  body.extend(b"\r\n")
              for name, filename, data, ctype in files:
                  body.extend(f"--{boundary}\r\n".encode())
                  body.extend(
                      f'Content-Disposition: form-data; name="{name}"; filename="{filename}"\r\n'.encode()
                  )
                  body.extend(f"Content-Type: {ctype}\r\n\r\n".encode())
                  body.extend(data)
                  body.extend(b"\r\n")
              body.extend(f"--{boundary}--\r\n".encode())
              url = f"{base}/{module_func}"
              req = urllib.request.Request(
                  url,
                  data=bytes(body),
                  headers={
                      "Authorization": auth,
                      "Content-Type": f"multipart/form-data; boundary={boundary}",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  return json.loads(r.read().decode())

          print(f"host={host} user={user}")
          info = call("Variables/get_user_information", timeout=25)
          home = (info.get("data") or {}).get("home") or (info.get("data") or {}).get("homedir") or f"/home/{user}"
          print(f"home={home}")

          listing = call("Fileman/list_files", {"dir": home}, timeout=25)
          names = []
          for e in listing.get("data") or []:
              if e.get("type") == "dir":
                  n = e.get("file") or ""
                  if n == "aliesmo" or n.lower().startswith("aliesmo"):
                      names.append(n)
          if "aliesmo" in names:
              app_name = "aliesmo"
          elif names:
              names.sort()
              app_name = names[0]
          else:
              print("FAIL: no aliesmo* dir", json.dumps(listing)[:500])
              sys.exit(1)

          app_dir = f"{home}/{app_name}"
          pub_dir = f"{home}/public_html"
          print(f"APP_DIR={app_dir}")
          print(f"PUB_DIR={pub_dir}")

          # (local, remote_dir, remote_filename)
          text_files = [
              ("routes/web.php", f"{app_dir}/routes", "web.php"),
              ("routes/api.php", f"{app_dir}/routes", "api.php"),
              ("resources/views/maintenance.blade.php", f"{app_dir}/resources/views", "maintenance.blade.php"),
              ("resources/views/shipping-label.blade.php", f"{app_dir}/resources/views", "shipping-label.blade.php"),
              ("app/Http/Controllers/ShippingLabelController.php", f"{app_dir}/app/Http/Controllers", "ShippingLabelController.php"),
              ("app/Http/Middleware/SecurityHeaders.php", f"{app_dir}/app/Http/Middleware", "SecurityHeaders.php"),
              ("app/Filament/Resources/OrderResource.php", f"{app_dir}/app/Filament/Resources", "OrderResource.php"),
              ("app/Filament/Widgets/OrdersWidget.php", f"{app_dir}/app/Filament/Widgets", "OrdersWidget.php"),
              ("app/Filament/Widgets/ProductsWidget.php", f"{app_dir}/app/Filament/Widgets", "ProductsWidget.php"),
              ("app/Filament/Widgets/ReviewsWidget.php", f"{app_dir}/app/Filament/Widgets", "ReviewsWidget.php"),
              ("app/Filament/Widgets/UsersWidget.php", f"{app_dir}/app/Filament/Widgets", "UsersWidget.php"),
              ("config/cors.php", f"{app_dir}/config", "cors.php"),
              ("public/deploy-runner.php", pub_dir, "deploy-runner.php"),
          ]

          binary_files = [
              ("public/js/JsBarcode.all.min.js", f"{pub_dir}/js", "JsBarcode.all.min.js"),
              ("public/jnt-express-logo.svg", pub_dir, "jnt-express-logo.svg"),
              ("public/New_Logo_JNE.png", pub_dir, "New_Logo_JNE.png"),
              ("public/POSIND_2023.svg", pub_dir, "POSIND_2023.svg"),
          ]
          man = Path("public/build/manifest.json")
          if man.is_file():
              text_files.append((str(man), f"{pub_dir}/build", "manifest.json"))
          assets = Path("public/build/assets")
          if assets.is_dir():
              for p in assets.iterdir():
                  if p.is_file():
                      binary_files.append((str(p), f"{pub_dir}/build/assets", p.name))

          fail = 0

          def mkdir(path):
              try:
                  call("Fileman/mkdir", {"path": path, "permissions": "0755"}, timeout=15)
              except Exception:
                  pass

          for local, rdir, fname in text_files:
              p = Path(local)
              if not p.is_file():
                  print(f"skip missing {local}")
                  continue
              content = p.read_text(encoding="utf-8")
              mkdir(rdir)
              print(f"SAVE {local} -> {rdir}/{fname} ", end="", flush=True)
              try:
                  # cPanel save_file_content
                  res = call(
                      "Fileman/save_file_content",
                      {
                          "dir": rdir,
                          "file": fname,
                          "content": content,
                          "fallback": 1,
                      },
                      timeout=40,
                  )
                  ok = res.get("status") == 1 or (res.get("errors") in (None, [], ""))
                  if ok and res.get("status") != 0:
                      print("OK")
                  else:
                      # try filepath form
                      res2 = call(
                          "Fileman/save_file_content",
                          {
                              "filepath": f"{rdir}/{fname}",
                              "content": content,
                          },
                          timeout=40,
                      )
                      if res2.get("status") == 1:
                          print("OK(filepath)")
                      else:
                          print("FAIL", json.dumps(res)[:200], json.dumps(res2)[:200])
                          fail = 1
              except Exception as e:
                  print(f"FAIL {e}")
                  fail = 1

          for local, rdir, fname in binary_files:
              p = Path(local)
              if not p.is_file():
                  print(f"skip missing {local}")
                  continue
              mkdir(rdir)
              data = p.read_bytes()
              print(f"PUT  {local} ({len(data)}b) -> {rdir}/ ", end="", flush=True)
              try:
                  res = post_multipart(
                      "Fileman/upload_files",
                      {"dir": rdir},
                      [("file-1", fname, data, "application/octet-stream")],
                      timeout=45,
                  )
                  if res.get("status") == 1:
                      print("OK")
                  else:
                      print("FAIL", json.dumps(res)[:250])
                      fail = 1
              except Exception as e:
                  print(f"FAIL {e}")
                  fail = 1

          if fail:
              print("Some deploys failed")
              sys.exit(1)
          print("All deploys OK")
          PY

      - name: Verify maintenance live
        run: |
          set -e
          sleep 3
          curl -sS --connect-timeout 15 --max-time 30 -o /tmp/home.html "https://aliesmo.id/" || true
          if grep -qiE 'pemeliharaan|Maintenance|sedang dalam' /tmp/home.html; then
            echo "VERIFY OK: maintenance page live"
            exit 0
          fi
          echo "VERIFY FAIL — not maintenance yet"
          head -c 600 /tmp/home.html || true
          exit 1
