name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Setup Node & build assets ──────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ─── 3. Trigger cPanel Git Version Control deploy ──────────────
      # Server pull + deploy dari GitHub langsung — bypass FTP/firewall
      - name: Trigger cPanel git deploy
        run: |
          BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"
          REPO_ROOT="/home/${{ secrets.CPANEL_USERNAME }}/public_html"

          # 1. Fetch latest dari GitHub ke server
          echo "=== Fetching from GitHub ==="
          curl -s --max-time 60 -H "$AUTH" \
            "$BASE/execute/VersionControl/update?repository_root=$REPO_ROOT"

          # 2. Trigger deploy (copy ke working dir)
          echo ""
          echo "=== Deploying ==="
          curl -s --max-time 60 -H "$AUTH" \
            -X POST -d "repository_root=$REPO_ROOT" \
            "$BASE/execute/VersionControlDeployments/create"

      # ─── 4. Run artisan migrate dan optimize:clear ─────────────────
      - name: Run artisan migrate and optimize:clear
        run: |
          echo "Running migrate and optimize:clear via deploy script..."
          curl -s -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "https://aliesmo.id/deploy-runner.php" || true
          echo "Done."
