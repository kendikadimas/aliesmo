name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Setup Node & build assets ──────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ─── 3. Trigger cPanel Git Version Control pull ────────────────
      # Server pull dari GitHub langsung — bypass FTP/firewall
      - name: Trigger cPanel git pull
        run: |
          RESPONSE=$(curl -s --max-time 60 \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControl/update?repository_root=/home/${{ secrets.CPANEL_USERNAME }}/public_html")
          echo "$RESPONSE"
          # gagal jika errors array tidak kosong
          echo "$RESPONSE" | grep -q '"errors":\[\]' || (echo "cPanel git pull gagal" && exit 1)

      # ─── 4. Run artisan migrate dan optimize:clear ─────────────────
      - name: Run artisan migrate and optimize:clear
        run: |
          echo "Running migrate and optimize:clear via deploy script..."
          curl -s -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "https://aliesmo.id/deploy-runner.php" || true
          echo "Done."
