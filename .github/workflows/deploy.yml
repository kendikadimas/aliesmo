name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy critical files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Plain FTP LIST hung. No dir listing — hardcode aliesmo1 (UAPI last known).
      # One file first; if OK, rest of batch.
      - name: FTP PUT web.php only (hardcoded path)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          HOST="${FTP_SERVER#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST%%/*}"
          USER="${FTP_USERNAME}"
          PASS="${FTP_PASSWORD}"
          SRC="routes/web.php"
          # last known app dir from UAPI list
          REMOTE="aliesmo1/routes/web.php"

          echo "host=$HOST"
          echo "target=ftp://${HOST}/${REMOTE}"
          ls -la "$SRC"

          # verbose, short timeouts — no LIST, no --ftp-create-dirs (dirs exist)
          curl -v --connect-timeout 10 --max-time 35 \
            --user "${USER}:${PASS}" \
            -T "$SRC" \
            "ftp://${HOST}/${REMOTE}" 2>&1 | tail -40

          echo "=== batch rest ==="
          put() {
            local src="$1" remote="$2"
            echo -n "PUT $remote "
            if curl -sS --connect-timeout 10 --max-time 30 \
              --user "${USER}:${PASS}" \
              -T "$src" \
              "ftp://${HOST}/${remote}"; then
              echo OK
            else
              echo FAIL
              return 1
            fi
          }
          FAIL=0
          put "resources/views/maintenance.blade.php" "aliesmo1/resources/views/maintenance.blade.php" || FAIL=1
          put "resources/views/shipping-label.blade.php" "aliesmo1/resources/views/shipping-label.blade.php" || FAIL=1
          put "app/Http/Controllers/ShippingLabelController.php" "aliesmo1/app/Http/Controllers/ShippingLabelController.php" || FAIL=1
          put "public/deploy-runner.php" "public_html/deploy-runner.php" || FAIL=1
          put "public/js/JsBarcode.all.min.js" "public_html/js/JsBarcode.all.min.js" || FAIL=1
          put "public/jnt-express-logo.svg" "public_html/jnt-express-logo.svg" || FAIL=1
          [ "$FAIL" -eq 0 ] || exit 1
          echo All OK

      - name: Verify maintenance live
        run: |
          sleep 3
          curl -sS --connect-timeout 10 --max-time 20 -o /tmp/home.html "https://aliesmo.id/" || true
          if grep -qiE 'pemeliharaan|Maintenance|sedang dalam' /tmp/home.html; then
            echo VERIFY OK
            exit 0
          fi
          echo VERIFY FAIL
          head -c 400 /tmp/home.html || true
          exit 1
