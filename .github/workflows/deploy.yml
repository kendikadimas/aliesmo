name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # cPanel FTP is broken from GitHub runners (scan hang / mid-transfer reset).
      # Deploy = zip over HTTPS → public/deploy-runner.php extract + migrate.
      # ONE-TIME: if HTTPS fails with "extract did not run", upload
      #   public/deploy-runner.php via cPanel File Manager, then re-run workflow.
      - name: Pack deploy.zip
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi

          : > /tmp/paths.txt
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR "$BEFORE" "$GITHUB_SHA" >> /tmp/paths.txt || true
          else
            git diff --name-only --diff-filter=ACMR HEAD~1 HEAD >> /tmp/paths.txt || true
          fi

          find public/build -type f 2>/dev/null >> /tmp/paths.txt || true
          printf '%s\n' \
            public/deploy-runner.php \
            resources/views/maintenance.blade.php \
            resources/views/shipping-label.blade.php \
            routes/web.php \
            routes/api.php \
            app/Http/Controllers/ShippingLabelController.php \
            app/Http/Middleware/SecurityHeaders.php \
            app/Filament/Resources/OrderResource.php \
            app/Filament/Widgets/OrdersWidget.php \
            app/Filament/Widgets/ProductsWidget.php \
            app/Filament/Widgets/ReviewsWidget.php \
            app/Filament/Widgets/UsersWidget.php \
            config/cors.php \
            public/js/JsBarcode.all.min.js \
            public/jnt-express-logo.svg \
            public/New_Logo_JNE.png \
            public/POSIND_2023.svg \
            >> /tmp/paths.txt

          grep -vE '^(frontend/|node_modules/|vendor/|\.git|\.github/|\.agents/|tests/|storage/)' /tmp/paths.txt \
            | grep -vE '(^|/)\.env' \
            | grep -vE 'public/js/filament/|public/css/filament/|public/fonts/' \
            | grep -vE '\.md$|composer\.(json|lock)$|package(-lock)?\.json$|phpunit|vite\.config|tailwind\.config|postcss\.config' \
            | grep -vE 'J&T' \
            | sort -u > /tmp/clean.txt

          : > /tmp/final.txt
          while IFS= read -r f; do
            [ -f "$f" ] && echo "$f" >> /tmp/final.txt
          done < /tmp/clean.txt

          echo "=== pack ==="
          cat /tmp/final.txt
          rm -f deploy.zip
          zip -r deploy.zip -@ < /tmp/final.txt
          ls -lh deploy.zip

      - name: Upload zip over HTTPS + extract + migrate
        run: |
          set -e
          echo "POST deploy.zip -> https://aliesmo.id/deploy-runner.php"
          RESP=$(curl -sS -w "\nHTTP:%{http_code}" \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -F "deploy_zip=@deploy.zip" \
            --connect-timeout 20 \
            --max-time 180 \
            "https://aliesmo.id/deploy-runner.php")
          echo "$RESP"

          if ! echo "$RESP" | grep -q 'HTTP:200'; then
            echo ""
            echo "FAIL: deploy-runner not reachable / wrong token / PHP error."
            echo "Upload local file public/deploy-runner.php via cPanel File Manager to:"
            echo "  public_html/public/deploy-runner.php  (or public_html/deploy-runner.php if docroot=public)"
            echo "Then re-run this workflow (Actions → Deploy to cPanel → Run workflow)."
            exit 1
          fi
          if ! echo "$RESP" | grep -q '"success":true'; then
            echo "FAIL: deploy-runner returned error body above"
            exit 1
          fi
          if ! echo "$RESP" | grep -qE '"extract":"ok'; then
            echo ""
            echo "FAIL: old deploy-runner (no zip extract). One-time manual step:"
            echo "  cPanel → File Manager → replace deploy-runner.php with repo public/deploy-runner.php"
            echo "Then re-run this workflow."
            exit 1
          fi
          echo "Deploy OK"
