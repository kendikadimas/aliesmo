name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Commit public/build ke repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/build
          git diff --cached --quiet || git commit -m "deploy: build artifacts [skip ci]"
          git push origin main

      # Zip hanya file app yang dibutuhkan prod — bukan vendor/node_modules/frontend source
      - name: Buat zip deploy
        run: |
          zip -r deploy.zip \
            app/ \
            bootstrap/ \
            config/ \
            database/ \
            resources/ \
            routes/ \
            public/index.php \
            public/deploy-runner.php \
            public/build/ \
            public/jnt-express-logo.svg \
            public/aliesmo-horizontal.png \
            public/New_Logo_JNE.png \
            public/POSIND_2023.svg \
            .htaccess \
            .cpanel.yml \
            artisan \
            composer.json \
            composer.lock

      # Deploy via cPanel Git VC — trigger pull langsung dari GitHub, tidak perlu zip/FTP/runner
      - name: Deploy via cPanel Git VC
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS --max-time 60 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/retrieve_repositories" \
            -w "\nHTTP:%{http_code}")
          echo "Repos: $RESP"
          REPO_DIR=$(echo "$RESP" | grep -o '"repository_root":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Deploying repo at: $REPO_DIR"
          DEPLOY=$(curl -sS --max-time 120 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            -d "repository_root=${REPO_DIR}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create" \
            -w "\nHTTP:%{http_code}")
          echo "Deploy: $DEPLOY"
          echo "$DEPLOY" | grep -qE '"result":\s*1|"status":\s*1|"deployable"' || echo "Warning: check deploy status above"

      - name: Warm site
        run: |
          curl -sk --max-time 15 -o /dev/null -w "HOME %{http_code}\n" "${{ secrets.APP_URL }}/" || true
          curl -sk --max-time 15 -o /dev/null -w "UP   %{http_code}\n" "${{ secrets.APP_URL }}/up" || true
