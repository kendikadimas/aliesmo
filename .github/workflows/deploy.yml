name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Upload build assets langsung via FTP — skip commit ke repo agar tidak loop
      - name: Upload public/build via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/build/
          server-dir: /public_html/build/
          dangerous-clean-slate: true

      # ponytail: hardcode repo_root karena kita tahu path-nya — skip retrieve_repositories
      - name: Deploy via cPanel Git VC
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          REPO_ROOT="/home/${CPANEL_USER}/public_html"
          echo "Triggering deploy for: $REPO_ROOT"
          DEPLOY=$(curl -sS --max-time 120 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            -G --data-urlencode "repository_root=${REPO_ROOT}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/deploy" \
            -w "\nHTTP:%{http_code}")
          echo "Deploy response: $DEPLOY"

      - name: Warm site
        run: |
          curl -sk --max-time 15 -o /dev/null -w "HOME %{http_code}\n" "${{ secrets.APP_URL }}/" || true
          curl -sk --max-time 15 -o /dev/null -w "UP   %{http_code}\n" "${{ secrets.APP_URL }}/up" || true
