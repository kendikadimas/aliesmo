name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Full-tree FTP-Deploy-Action scan = cPanel ECONNRESET after ~5 min.
      # Upload 2 files only (lftp put) then extract via PHP.
      - name: Pack deploy.zip
        run: |
          set -e
          rm -f deploy.zip
          zip -r deploy.zip \
            app \
            bootstrap \
            config \
            database \
            public \
            resources \
            routes \
            artisan \
            .htaccess \
            -x "bootstrap/cache/*.php" \
            -x "public/hot" \
            -x "public/storage/**" \
            -x "public/js/filament/**" \
            -x "public/css/filament/**" \
            -x "public/fonts/**" \
            -x "database/factories/**" \
            -x "**/.DS_Store"
          ls -lh deploy.zip

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload zip + deploy-runner via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          lftp -c "
            set net:timeout 120;
            set net:max-retries 5;
            set net:reconnect-interval-base 15;
            set ftp:passive-mode true;
            set ftp:ssl-allow no;
            set cmd:fail-exit true;
            open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ${FTP_SERVER};
            cd /public_html;
            put -O public public/deploy-runner.php;
            put -O . deploy.zip;
            bye
          "
          echo "FTP put OK"

      - name: Extract zip + migrate
        run: |
          set -e
          echo "Extract + migrate via deploy-runner..."
          RESP=$(curl -sS -w "\nHTTP:%{http_code}" -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            --max-time 300 \
            "https://aliesmo.id/deploy-runner.php")
          echo "$RESP"
          echo "$RESP" | grep -q 'HTTP:200' || { echo "HTTP not 200"; exit 1; }
          echo "$RESP" | grep -q '"success":true' || { echo "success not true"; exit 1; }
          echo "Done."
