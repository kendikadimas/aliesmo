name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # ─── 2. Setup Node & build assets ──────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ─── 3. Commit build artifacts ke repo ────────────────────────────
      # Vite output langsung ke public/build — tidak perlu copy
      - name: Commit public/build ke repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/build
          git diff --cached --quiet || git commit -m "deploy: build artifacts [skip ci]"
          git push origin main

      # ─── 4. Trigger cPanel Git Version Control deploy ──────────────
      # Server pull + deploy dari GitHub langsung — bypass FTP/firewall
      - name: Trigger cPanel git deploy
        run: |
          BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"
          REPO_ROOT="/home/${{ secrets.CPANEL_USERNAME }}/public_html"

          # 1. Fetch latest dari GitHub ke server
          echo "=== Fetching from GitHub ==="
          curl -s --max-time 60 -H "$AUTH" \
            "$BASE/execute/VersionControl/update?repository_root=$REPO_ROOT"

          # 2. Trigger deploy — paksa dengan mengirim HEAD commit identifier
          echo ""
          echo "=== Deploying ==="
          HEAD_COMMIT="${{ github.sha }}"
          curl -s --max-time 120 -H "$AUTH" \
            -X POST \
            -d "repository_root=$REPO_ROOT" \
            -d "source_repository=origin" \
            -d "branch=main" \
            "$BASE/execute/VersionControlDeployments/create"

      # ─── 4. Clear Laravel cache via cPanel UAPI ───────────────────
      - name: Clear Laravel route dan config cache
        run: |
          BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"

          # Hapus cache files — path relatif dari home dir
          for FILE in \
            "public_html/bootstrap/cache/routes-v7.php" \
            "public_html/bootstrap/cache/config.php" \
            "public_html/bootstrap/cache/packages.php" \
            "public_html/bootstrap/cache/services.php"; do
            echo "Deleting $FILE..."
            curl -s --max-time 15 -H "$AUTH" \
              -X POST -d "files-0=$FILE" \
              "$BASE/execute/Fileman/delete" || true
          done
          echo "Cache cleared."
