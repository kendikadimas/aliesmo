name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # vendor tidak di-FTP (sudah di server). Skip composer di CI = lebih cepat.
      # Jika butuh composer di server: jalankan manual / via deploy-runner.

      # ─── FTP: cPanel sering ECONNRESET setelah scan lama ───
      # Exclude bulk yang jarang berubah biar scan <1 menit.
      - name: Deploy via FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./
          timeout: 300000
          log-level: standard
          exclude: |
            **/.git/**
            **/.github/**
            **/.agents/**
            **/.env
            **/.env.*
            **/.gitignore
            **/.gitattributes
            **/node_modules/**
            **/frontend/**
            **/vendor/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/**
            **/storage/app/**
            **/public/js/filament/**
            **/public/css/filament/**
            **/public/fonts/**
            **/database/factories/**
            **/*.md
            **/*.sql
            **/package.json
            **/package-lock.json
            **/composer.json
            **/composer.lock
            **/vite.config.js
            **/tailwind.config.js
            **/postcss.config.js
            **/phpunit.xml
            **/phpunit.xml.*
            **/test.txt
            **/run-migration.php
            **/setup.sql
            **/README-DEPLOY.txt
            **/J&T*

      - name: Wait before FTP retry
        if: steps.ftp1.outcome == 'failure'
        run: sleep 60

      - name: Deploy via FTP (retry 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./
          timeout: 300000
          log-level: standard
          exclude: |
            **/.git/**
            **/.github/**
            **/.agents/**
            **/.env
            **/.env.*
            **/.gitignore
            **/.gitattributes
            **/node_modules/**
            **/frontend/**
            **/vendor/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/**
            **/storage/app/**
            **/public/js/filament/**
            **/public/css/filament/**
            **/public/fonts/**
            **/database/factories/**
            **/*.md
            **/*.sql
            **/package.json
            **/package-lock.json
            **/composer.json
            **/composer.lock
            **/vite.config.js
            **/tailwind.config.js
            **/postcss.config.js
            **/phpunit.xml
            **/phpunit.xml.*
            **/test.txt
            **/run-migration.php
            **/setup.sql
            **/README-DEPLOY.txt
            **/J&T*

      - name: Wait before FTP retry 3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 90

      - name: Deploy via FTP (retry 3)
        id: ftp3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./
          timeout: 300000
          log-level: standard
          exclude: |
            **/.git/**
            **/.github/**
            **/.agents/**
            **/.env
            **/.env.*
            **/.gitignore
            **/.gitattributes
            **/node_modules/**
            **/frontend/**
            **/vendor/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/**
            **/storage/app/**
            **/public/js/filament/**
            **/public/css/filament/**
            **/public/fonts/**
            **/database/factories/**
            **/*.md
            **/*.sql
            **/package.json
            **/package-lock.json
            **/composer.json
            **/composer.lock
            **/vite.config.js
            **/tailwind.config.js
            **/postcss.config.js
            **/phpunit.xml
            **/phpunit.xml.*
            **/test.txt
            **/run-migration.php
            **/setup.sql
            **/README-DEPLOY.txt
            **/J&T*

      - name: Fail if all FTP attempts failed
        if: always() && steps.ftp1.outcome == 'failure' && (steps.ftp2.outcome == 'failure' || steps.ftp2.outcome == 'skipped') && (steps.ftp3.outcome == 'failure' || steps.ftp3.outcome == 'skipped')
        run: |
          echo "All FTP deploy attempts failed (cPanel control socket)."
          exit 1

      - name: Run artisan migrate and optimize:clear
        run: |
          echo "Running migrate and optimize:clear via deploy script..."
          curl -s -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "https://aliesmo.id/deploy-runner.php" || true
          echo "Done."
