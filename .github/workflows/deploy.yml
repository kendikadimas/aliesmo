name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Commit public/build ke repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/build
          git diff --cached --quiet || git commit -m "deploy: build artifacts [skip ci]"
          git push origin main

      # Fileman UAPI + deploy-runner sering diblok bot-protection dari GitHub IP.
      # FTP secrets sudah ada — path paling andal untuk PHP/blade.
      - name: FTP upload critical + changed files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "FTP secrets missing"
            exit 1
          fi

          FORCE=(
            bootstrap/app.php
            public/index.php
            public/deploy-runner.php
            routes/web.php
            app/Http/Controllers/ShippingLabelController.php
            resources/views/shipping-label.blade.php
            app/Filament/Resources/OrderResource.php
            app/Filament/Widgets/OrdersWidget.php
            app/Providers/Filament/AdminPanelProvider.php
          )

          mapfile -t RECENT < <(git log --name-only --pretty=format: -n 20 -- '*.php' '*.blade.php' 'public/build/*' | awk 'NF && !seen[$0]++')

          FILES=()
          for f in "${FORCE[@]}" "${RECENT[@]}"; do
            [ -f "$f" ] || continue
            case "$f" in
              vendor/*|node_modules/*|storage/*|bootstrap/cache/*|.env*) continue ;;
            esac
            FILES+=("$f")
          done
          mapfile -t FILES < <(printf '%s\n' "${FILES[@]}" | awk 'NF && !seen[$0]++')

          echo "Uploading ${#FILES[@]} files via FTP to $FTP_SERVER ..."
          printf '%s\n' "${FILES[@]}"

          # monorepo di public_html: remote path = repo-relative path
          # try FTPS first, then plain FTP
          upload_all() {
            local PROTO="$1"
            local FAIL=0
            for f in "${FILES[@]}"; do
              REMOTE_DIR=$(dirname "$f")
              echo "→ $PROTO $f"
              if ! curl -sS --max-time 120 --ftp-create-dirs \
                ${PROTO:+} \
                --user "$FTP_USERNAME:$FTP_PASSWORD" \
                -T "$f" \
                "$PROTO://$FTP_SERVER/$f"; then
                echo "FAIL $f"
                FAIL=1
              fi
            done
            return $FAIL
          }

          # Prefer explicit FTPS (common on cPanel); fall back to FTP
          if ! curl -sS --max-time 30 --user "$FTP_USERNAME:$FTP_PASSWORD" \
              "ftp://$FTP_SERVER/" -o /dev/null --ssl-reqd 2>/dev/null; then
            echo "Trying FTP without forced SSL..."
          fi

          FAIL=0
          for f in "${FILES[@]}"; do
            echo "→ $f"
            OK=0
            for URL in \
              "ftp://$FTP_SERVER/$f" \
              "ftps://$FTP_SERVER/$f"
            do
              if curl -sS --max-time 120 --ftp-create-dirs --ssl-reqd --insecure \
                  --user "$FTP_USERNAME:$FTP_PASSWORD" \
                  -T "$f" "$URL" 2>/tmp/ftp.err; then
                OK=1
                break
              fi
              if curl -sS --max-time 120 --ftp-create-dirs \
                  --user "$FTP_USERNAME:$FTP_PASSWORD" \
                  -T "$f" "ftp://$FTP_SERVER/$f" 2>/tmp/ftp.err; then
                OK=1
                break
              fi
            done
            if [ "$OK" -ne 1 ]; then
              echo "FAIL $f"
              cat /tmp/ftp.err || true
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "FTP upload had failures"
            exit 1
          fi
          echo "FTP upload OK"

      - name: Warm site + drop empty routes cache via deploy-runner
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # optional: clear routes cache only (no zip) — ignore failure
          if [ -n "${DEPLOY_TOKEN:-}" ]; then
            curl -sk --max-time 30 -H "X-Deploy-Token: $DEPLOY_TOKEN" \
              "https://aliesmo.id/deploy-runner.php" || true
          fi
          curl -sk --max-time 20 -o /dev/null -w "HOME %{http_code}\n" "https://aliesmo.id/" || true
          curl -sk --max-time 20 -o /dev/null -w "UP %{http_code}\n" "https://aliesmo.id/up" || true
