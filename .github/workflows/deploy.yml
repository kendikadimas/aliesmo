name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Commit public/build ke repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/build
          git diff --cached --quiet || git commit -m "deploy: build artifacts [skip ci]"
          git push origin main

      # Zip hanya file app yang dibutuhkan prod — bukan vendor/node_modules/frontend source
      - name: Buat zip deploy
        run: |
          zip -r deploy.zip \
            app/ \
            bootstrap/ \
            config/ \
            database/ \
            resources/ \
            routes/ \
            public/index.php \
            public/deploy-runner.php \
            public/build/ \
            public/jnt-express-logo.svg \
            public/aliesmo-horizontal.png \
            public/New_Logo_JNE.png \
            public/POSIND_2023.svg \
            .htaccess \
            .cpanel.yml \
            artisan \
            composer.json \
            composer.lock

      # Upload runner terbaru via cPanel UAPI — lebih reliable dari FTP untuk 1 file kecil
      - name: Bootstrap deploy-runner via cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          CONTENT=$(base64 -w 0 public/deploy-runner.php)
          RESP=$(curl -sS --max-time 30 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file_content?dir=%2Fhome%2F${CPANEL_USER}%2Fpublic_html&file=deploy-runner.php&content=${CONTENT}" \
            -w "\nHTTP:%{http_code}")
          echo "cPanel bootstrap: $RESP"

      # Kirim zip ke deploy-runner.php di server — tidak pakai FTP, tidak pakai Fileman UAPI
      - name: Deploy via deploy-runner
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          RUNNER_URL="${APP_URL}/deploy-runner.php"
          echo "Posting to $RUNNER_URL"
          RESPONSE=$(curl -sS --max-time 120 \
            -w "\nHTTP_STATUS:%{http_code}" \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -F "deploy_zip=@deploy.zip" \
            "$RUNNER_URL" || echo "CURL_FAILED:$?")
          echo "RESPONSE: $RESPONSE"
          echo "$RESPONSE" | grep -q '"success":true' || { echo "Deploy runner returned error"; exit 1; }

      - name: Warm site
        run: |
          curl -sk --max-time 15 -o /dev/null -w "HOME %{http_code}\n" "${{ secrets.APP_URL }}/" || true
          curl -sk --max-time 15 -o /dev/null -w "UP   %{http_code}\n" "${{ secrets.APP_URL }}/up" || true
