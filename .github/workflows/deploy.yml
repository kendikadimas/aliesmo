name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: FTP PUT + RETR verify
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          HOST="${FTP_SERVER#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST%%/*}"
          USER="${FTP_USERNAME}"
          PASS="${FTP_PASSWORD}"
          APP=aliesmo1
          AUTH=(--user "${USER}:${PASS}")

          put() {
            local src="$1" remote="$2"
            [ -f "$src" ] || { echo "skip $src"; return 0; }
            echo -n "PUT $remote "
            # Longer wait for 226 after data; also try --ftp-skip-pasv-ip
            OUT=$(curl -sS -v --connect-timeout 10 --max-time 45 \
              --ftp-skip-pasv-ip \
              "${AUTH[@]}" \
              -T "$src" \
              "ftp://${HOST}/${remote}" 2>&1) || true
            if echo "$OUT" | grep -qE 'completely uploaded|226|Transfer complete'; then
              echo OK
              return 0
            fi
            echo FAIL
            echo "$OUT" | tail -10
            return 1
          }

          FAIL=0
          put "routes/web.php" "${APP}/routes/web.php" || FAIL=1
          put "resources/views/maintenance.blade.php" "${APP}/resources/views/maintenance.blade.php" || FAIL=1
          put "resources/views/shipping-label.blade.php" "${APP}/resources/views/shipping-label.blade.php" || FAIL=1
          put "app/Http/Controllers/ShippingLabelController.php" "${APP}/app/Http/Controllers/ShippingLabelController.php" || FAIL=1
          put "public/index.php" "public_html/index.php" || FAIL=1
          put "public/deploy-runner.php" "public_html/deploy-runner.php" || FAIL=1
          put "public/js/JsBarcode.all.min.js" "public_html/js/JsBarcode.all.min.js" || FAIL=1
          put "public/jnt-express-logo.svg" "public_html/jnt-express-logo.svg" || FAIL=1

          echo "=== RETR verify remote content ==="
          curl -sS --connect-timeout 10 --max-time 25 \
            --ftp-skip-pasv-ip \
            "${AUTH[@]}" \
            "ftp://${HOST}/${APP}/routes/web.php" -o /tmp/remote-web.php || true
          echo "remote web.php size: $(wc -c </tmp/remote-web.php 2>/dev/null || echo 0)"
          head -c 400 /tmp/remote-web.php || true
          echo
          if grep -q "view('maintenance')" /tmp/remote-web.php 2>/dev/null; then
            echo "RETR OK: maintenance in remote web.php"
          else
            echo "RETR FAIL: remote web.php missing maintenance"
            FAIL=1
          fi

          curl -sS --connect-timeout 10 --max-time 25 \
            --ftp-skip-pasv-ip \
            "${AUTH[@]}" \
            "ftp://${HOST}/public_html/index.php" -o /tmp/remote-index.php || true
          echo "remote index.php size: $(wc -c </tmp/remote-index.php 2>/dev/null || echo 0)"
          if grep -q "aliesmo1" /tmp/remote-index.php 2>/dev/null; then
            echo "RETR OK: aliesmo1 in remote index.php"
          else
            echo "RETR WARN: aliesmo1 not in remote index.php"
            head -c 300 /tmp/remote-index.php || true
            echo
          fi

          # Clear caches via empty overwrite of routes cache (DELE often flaky)
          echo "=== clear bootstrap cache ==="
          : > /tmp/empty.php
          for f in bootstrap/cache/routes-v7.php bootstrap/cache/config.php bootstrap/cache/services.php; do
            put /tmp/empty.php "${APP}/${f}" || true
          done

          [ "$FAIL" -eq 0 ] || exit 1
          echo All OK

      - name: Verify maintenance live
        run: |
          sleep 5
          for i in 1 2 3; do
            curl -sS -H "Cache-Control: no-cache" --connect-timeout 10 --max-time 20 \
              -o /tmp/home.html "https://aliesmo.id/?_=$(date +%s)$i" || true
            if grep -qiE 'pemeliharaan|Maintenance|sedang dalam' /tmp/home.html; then
              echo VERIFY OK
              exit 0
            fi
            sleep 3
          done
          echo VERIFY FAIL
          head -c 600 /tmp/home.html || true
          exit 1
