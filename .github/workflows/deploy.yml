name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # cPanel FTP drops mid-transfer (ECONNRESET / max-retries). #299 was fast only when
      # almost nothing changed. Deploy over HTTPS instead — same channel as the live site.
      - name: Pack deploy.zip (changed + essentials)
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi

          : > /tmp/paths.txt
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR "$BEFORE" "$GITHUB_SHA" >> /tmp/paths.txt || true
          else
            git diff --name-only --diff-filter=ACMR HEAD~1 HEAD >> /tmp/paths.txt || true
          fi

          # always include SPA build + runner + catch-up undeployed since #299
          find public/build -type f 2>/dev/null >> /tmp/paths.txt || true
          printf '%s\n' \
            public/deploy-runner.php \
            resources/views/maintenance.blade.php \
            resources/views/shipping-label.blade.php \
            routes/web.php \
            routes/api.php \
            app/Http/Controllers/ShippingLabelController.php \
            app/Http/Middleware/SecurityHeaders.php \
            app/Filament/Resources/OrderResource.php \
            app/Filament/Widgets/OrdersWidget.php \
            app/Filament/Widgets/ProductsWidget.php \
            app/Filament/Widgets/ReviewsWidget.php \
            app/Filament/Widgets/UsersWidget.php \
            config/cors.php \
            public/js/JsBarcode.all.min.js \
            public/jnt-express-logo.svg \
            public/New_Logo_JNE.png \
            public/POSIND_2023.svg \
            >> /tmp/paths.txt

          grep -vE '^(frontend/|node_modules/|vendor/|\.git|\.github/|\.agents/|tests/|storage/)' /tmp/paths.txt \
            | grep -vE '(^|/)\.env' \
            | grep -vE 'public/js/filament/|public/css/filament/|public/fonts/' \
            | grep -vE '\.md$|composer\.(json|lock)$|package(-lock)?\.json$|phpunit|vite\.config|tailwind\.config|postcss\.config' \
            | grep -vE 'J&T' \
            | sort -u > /tmp/clean.txt

          : > /tmp/final.txt
          while IFS= read -r f; do
            [ -f "$f" ] && echo "$f" >> /tmp/final.txt
          done < /tmp/clean.txt

          echo "=== pack ==="
          cat /tmp/final.txt
          rm -f deploy.zip
          # zip preserves paths
          zip -r deploy.zip -@ < /tmp/final.txt
          ls -lh deploy.zip

      - name: Bootstrap deploy-runner.php via FTP (tiny, once)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # only the ~2KB runner — so HTTP extract works even if old runner lacks upload support
          lftp -c "
            set net:timeout 90;
            set net:max-retries 5;
            set net:reconnect-interval-base 15;
            set ftp:passive-mode true;
            set ftp:ssl-allow no;
            set cmd:fail-exit true;
            open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ${FTP_SERVER};
            cd /public_html;
            put -O public public/deploy-runner.php;
            bye
          " || echo "FTP bootstrap skipped/failed — will try HTTP if old runner already accepts zip"

      - name: Upload zip over HTTPS + extract + migrate
        run: |
          set -e
          echo "POST deploy.zip -> deploy-runner.php"
          RESP=$(curl -sS -w "\nHTTP:%{http_code}" \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -F "deploy_zip=@deploy.zip" \
            --max-time 300 \
            "https://aliesmo.id/deploy-runner.php")
          echo "$RESP"
          echo "$RESP" | grep -q 'HTTP:200' || { echo "HTTP not 200"; exit 1; }
          echo "$RESP" | grep -q '"success":true' || { echo "deploy failed"; exit 1; }
          echo "Deploy OK"
