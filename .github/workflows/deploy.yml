name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # FTP hang + HTTPS bot wall. UAPI extract() missing. Upload small files only via UAPI.
      - name: Deploy via cPanel UAPI (small files)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          HOST="${CPANEL_HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"
          USER="${CPANEL_USERNAME}"
          TOKEN="${CPANEL_API_TOKEN}"
          AUTH="Authorization: cpanel ${USER}:${TOKEN}"
          BASE="https://${HOST}:2083/execute"
          echo "host=$HOST user=$USER"

          uapi() { curl -sS --connect-timeout 20 --max-time 45 -H "$AUTH" "$@"; }

          INFO=$(uapi "${BASE}/Variables/get_user_information")
          HOME_DIR=$(php -r '$j=json_decode(stream_get_contents(STDIN),true); echo $j["data"]["home"]??$j["data"]["homedir"]??"";' <<<"$INFO")
          [ -n "$HOME_DIR" ] || HOME_DIR="/home/${USER}"
          echo "home=$HOME_DIR"

          LIST=$(uapi --get --data-urlencode "dir=${HOME_DIR}" --max-time 30 "${BASE}/Fileman/list_files" || true)
          APP_NAME=$(php -r '
            $j=json_decode(stream_get_contents(STDIN),true);
            $c=[];
            foreach(($j["data"]??[]) as $e){
              if(($e["type"]??"")!=="dir") continue;
              $n=$e["file"]??"";
              if($n==="aliesmo" || preg_match("/^aliesmo/i",$n)) $c[]=$n;
            }
            if(in_array("aliesmo",$c,true)){echo "aliesmo";exit;}
            sort($c); echo $c[0]??"";
          ' <<<"$LIST")
          if [ -z "$APP_NAME" ]; then
            echo "FAIL: no aliesmo* directory under home"
            echo "$LIST" | head -c 600
            exit 1
          fi
          APP_DIR="${HOME_DIR}/${APP_NAME}"
          PUB_DIR="${HOME_DIR}/public_html"
          echo "APP_DIR=$APP_DIR"
          echo "PUB_DIR=$PUB_DIR"

          # map: local_path|remote_absolute_dir
          # public/* -> public_html (strip public/)
          # else -> APP_DIR
          MAP=$(cat <<'EOF'
routes/web.php|APP
routes/api.php|APP
resources/views/maintenance.blade.php|APP
resources/views/shipping-label.blade.php|APP
app/Http/Controllers/ShippingLabelController.php|APP
app/Http/Middleware/SecurityHeaders.php|APP
app/Filament/Resources/OrderResource.php|APP
app/Filament/Widgets/OrdersWidget.php|APP
app/Filament/Widgets/ProductsWidget.php|APP
app/Filament/Widgets/ReviewsWidget.php|APP
app/Filament/Widgets/UsersWidget.php|APP
config/cors.php|APP
public/deploy-runner.php|PUB
public/js/JsBarcode.all.min.js|PUB
public/jnt-express-logo.svg|PUB
public/New_Logo_JNE.png|PUB
public/POSIND_2023.svg|PUB
EOF
)
          # built SPA assets (only hashed css/js + manifest — skip huge logos)
          if [ -f public/build/manifest.json ]; then
            MAP="${MAP}"$'\n'"public/build/manifest.json|PUB"
          fi
          for f in public/build/assets/*; do
            [ -f "$f" ] || continue
            MAP="${MAP}"$'\n'"${f}|PUB"
          done

          FAIL=0
          while IFS='|' read -r local_path kind; do
            [ -z "$local_path" ] && continue
            [ -f "$local_path" ] || { echo "skip missing $local_path"; continue; }

            if [ "$kind" = "PUB" ]; then
              rel="${local_path#public/}"
              parent=$(dirname "$rel")
              if [ "$parent" = "." ]; then
                rdir="$PUB_DIR"
              else
                rdir="${PUB_DIR}/${parent}"
              fi
            else
              parent=$(dirname "$local_path")
              if [ "$parent" = "." ]; then
                rdir="$APP_DIR"
              else
                rdir="${APP_DIR}/${parent}"
              fi
            fi

            base=$(basename "$local_path")
            # mkdir parents (ignore errors if exists)
            uapi --get \
              --data-urlencode "path=${rdir}" \
              --data-urlencode "permissions=0755" \
              "${BASE}/Fileman/mkdir" >/dev/null 2>&1 || true

            echo -n "PUT $local_path -> $rdir/ ... "
            RES=$(curl -sS --connect-timeout 20 --max-time 60 \
              -H "$AUTH" \
              -F "dir=${rdir}" \
              -F "file-1=@${local_path};filename=${base}" \
              "${BASE}/Fileman/upload_files" || echo '{"status":0,"errors":["curl failed"]}')
            if echo "$RES" | grep -qE '"status"[[:space:]]*:[[:space:]]*1'; then
              echo "OK"
            else
              echo "FAIL"
              echo "$RES" | head -c 400
              echo
              FAIL=1
            fi
          done <<<"$MAP"

          if [ "$FAIL" -ne 0 ]; then
            echo "Some uploads failed"
            exit 1
          fi
          echo "All uploads OK"

      - name: Verify maintenance live
        run: |
          set -e
          sleep 2
          CODE=$(curl -sS -o /tmp/home.html -w "%{http_code}" --connect-timeout 15 --max-time 30 "https://aliesmo.id/" || echo 000)
          echo "HTTP $CODE"
          if grep -qiE 'pemeliharaan|Maintenance|sedang dalam' /tmp/home.html; then
            echo "VERIFY OK — maintenance page live"
            exit 0
          fi
          echo "VERIFY FAIL — body head:"
          head -c 500 /tmp/home.html
          exit 1
