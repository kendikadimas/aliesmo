name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # lftp put langsung (tanpa scan tree). Ini yang bikin #307–#311 hang:
      # FTP-Deploy-Action scan 5 menit → cPanel drop socket → upload pertama gagal.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Push changed files via lftp (no tree scan)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          lftp -c "
            set net:timeout 60;
            set net:max-retries 3;
            set net:reconnect-interval-base 10;
            set ftp:passive-mode true;
            set ftp:ssl-allow no;
            set cmd:fail-exit true;
            open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ${FTP_SERVER};
            cd /public_html;
            mirror -R --verbose --only-newer \
              --exclude-glob node_modules/** \
              --exclude-glob frontend/** \
              --exclude-glob vendor/** \
              --exclude-glob .git/** \
              --exclude-glob .github/** \
              --exclude-glob .agents/** \
              --exclude-glob tests/** \
              --exclude-glob storage/logs/** \
              --exclude-glob storage/framework/** \
              --exclude-glob storage/app/** \
              --exclude-glob public/js/filament/** \
              --exclude-glob public/css/filament/** \
              --exclude-glob public/fonts/** \
              --exclude-glob '*.md' \
              --exclude-glob composer.* \
              --exclude-glob package*.json \
              ./ ./;
            bye
          "
          echo "lftp mirror OK"

      - name: Run artisan migrate and optimize:clear
        run: |
          echo "Running migrate and optimize:clear via deploy script..."
          curl -s -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "https://aliesmo.id/deploy-runner.php" || true
          echo "Done."
