name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # FTP mid-transfer dies on this host. Prefer HTTPS zip → PHP extract.
      # Bootstrap only the ~2KB runner via curl FTP (short timeout, both path layouts).
      - name: Pack deploy.zip
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi

          : > /tmp/paths.txt
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR "$BEFORE" "$GITHUB_SHA" >> /tmp/paths.txt || true
          else
            git diff --name-only --diff-filter=ACMR HEAD~1 HEAD >> /tmp/paths.txt || true
          fi

          find public/build -type f 2>/dev/null >> /tmp/paths.txt || true
          printf '%s\n' \
            public/deploy-runner.php \
            resources/views/maintenance.blade.php \
            resources/views/shipping-label.blade.php \
            routes/web.php \
            routes/api.php \
            app/Http/Controllers/ShippingLabelController.php \
            app/Http/Middleware/SecurityHeaders.php \
            app/Filament/Resources/OrderResource.php \
            app/Filament/Widgets/OrdersWidget.php \
            app/Filament/Widgets/ProductsWidget.php \
            app/Filament/Widgets/ReviewsWidget.php \
            app/Filament/Widgets/UsersWidget.php \
            config/cors.php \
            public/js/JsBarcode.all.min.js \
            public/jnt-express-logo.svg \
            public/New_Logo_JNE.png \
            public/POSIND_2023.svg \
            >> /tmp/paths.txt

          grep -vE '^(frontend/|node_modules/|vendor/|\.git|\.github/|\.agents/|tests/|storage/)' /tmp/paths.txt \
            | grep -vE '(^|/)\.env' \
            | grep -vE 'public/js/filament/|public/css/filament/|public/fonts/' \
            | grep -vE '\.md$|composer\.(json|lock)$|package(-lock)?\.json$|phpunit|vite\.config|tailwind\.config|postcss\.config' \
            | grep -vE 'J&T' \
            | sort -u > /tmp/clean.txt

          : > /tmp/final.txt
          while IFS= read -r f; do
            [ -f "$f" ] && echo "$f" >> /tmp/final.txt
          done < /tmp/clean.txt

          echo "=== pack ==="
          cat /tmp/final.txt
          rm -f deploy.zip
          zip -r deploy.zip -@ < /tmp/final.txt
          ls -lh deploy.zip

      - name: Bootstrap deploy-runner.php (curl FTP, 45s max)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          # URL-encode is not applied; passwords with special chars may need care in secrets
          HOST="${FTP_SERVER}"
          # strip scheme if present
          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"

          AUTH="${FTP_USERNAME}:${FTP_PASSWORD}"
          FILE="public/deploy-runner.php"

          try_put() {
            local dest="$1"
            echo "FTP PUT -> $dest"
            curl --silent --show-error --fail \
              --connect-timeout 20 \
              --max-time 45 \
              --ftp-pasv \
              --retry 2 \
              --retry-delay 5 \
              -u "$AUTH" \
              -T "$FILE" \
              "ftp://${HOST}${dest}"
            return $?
          }

          # layout A: full repo under public_html (historical workflow)
          try_put "/public_html/public/deploy-runner.php"
          RC1=$?
          # layout B: document root = public/
          try_put "/public_html/deploy-runner.php"
          RC2=$?

          if [ $RC1 -ne 0 ] && [ $RC2 -ne 0 ]; then
            echo "::warning::FTP bootstrap failed (cPanel FTP flaky). If HTTPS step fails, upload public/deploy-runner.php once via cPanel File Manager."
          else
            echo "FTP bootstrap OK"
          fi
          # never fail the job here — HTTPS is the real deploy
          exit 0

      - name: Upload zip over HTTPS + extract + migrate
        run: |
          set -e
          echo "POST deploy.zip -> deploy-runner.php"
          RESP=$(curl -sS -w "\nHTTP:%{http_code}" \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -F "deploy_zip=@deploy.zip" \
            --max-time 300 \
            "https://aliesmo.id/deploy-runner.php")
          echo "$RESP"

          if ! echo "$RESP" | grep -q 'HTTP:200'; then
            echo "HTTP not 200 — deploy-runner missing/old/token wrong"
            exit 1
          fi
          if ! echo "$RESP" | grep -q '"success":true'; then
            echo "deploy-runner returned failure"
            exit 1
          fi
          # old runner has no extract key / extract skipped — not a real deploy
          if ! echo "$RESP" | grep -qE '"extract":"ok'; then
            echo "extract did not run. Upload public/deploy-runner.php via cPanel File Manager once, then re-run this workflow."
            exit 1
          fi
          echo "Deploy OK"
