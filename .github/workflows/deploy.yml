name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # ─── 2. Setup Node & build assets ──────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ─── 3. Commit build artifacts ke repo ────────────────────────────
      - name: Commit public/build ke repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/build
          git diff --cached --quiet || git commit -m "deploy: build artifacts [skip ci]"
          git push origin main

      # ─── 4. Fetch via cPanel Git Version Control ──────────────────
      - name: Fetch via cPanel Git VC
        run: |
          BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"
          REPO_ROOT="/home/${{ secrets.CPANEL_USERNAME }}/public_html"
          curl -s --max-time 60 -H "$AUTH" \
            "$BASE/execute/VersionControl/update?repository_root=$REPO_ROOT"

      # ─── 5. Upload changed PHP files via Fileman/save_file_content ──
      - name: Upload changed PHP files to server
        run: |
          BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"
          HOME_DIR="/home/${{ secrets.CPANEL_USERNAME }}"

          # Ambil SHA terakhir yang berhasil di-deploy dari file tracking
          LAST_SHA=""
          LAST_SHA_RESPONSE=$(curl -sk --max-time 10 -H "$AUTH" \
            "$BASE/execute/Fileman/get_file_content?dir=%2F${HOME_DIR#/}%2Fpublic_html&file=.last-deploy-sha" 2>/dev/null || true)
          LAST_SHA=$(echo "$LAST_SHA_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('content','').strip())" 2>/dev/null || true)

          if [ -z "$LAST_SHA" ]; then
            # Fallback: diff HEAD^ jika tidak ada SHA tersimpan
            CHANGED=$(git diff --name-only HEAD^ HEAD -- '*.php' '*.blade.php' 2>/dev/null || true)
            echo "No last deploy SHA found, using HEAD^ diff"
          else
            CHANGED=$(git diff --name-only "$LAST_SHA" HEAD -- '*.php' '*.blade.php' 2>/dev/null || true)
            echo "Diffing from $LAST_SHA to HEAD"
          fi

          echo "Changed files: ${CHANGED:-none}"

          # Selalu upload bootstrap/app.php — file kritis yang sering gagal via File Manager
          ALWAYS="bootstrap/app.php bootstrap/cache/services.php bootstrap/cache/packages.php"

          for FILE in $ALWAYS $CHANGED; do
            [ -f "$FILE" ] || continue
            DIR="$HOME_DIR/public_html/$(dirname $FILE)"
            FILENAME=$(basename $FILE)
            CONTENT=$(cat "$FILE")
            echo "Saving $FILE..."
            RESULT=$(curl -sk --max-time 60 \
              -H "$AUTH" \
              --data-urlencode "dir=$DIR" \
              --data-urlencode "file=$FILENAME" \
              --data-urlencode "content=$CONTENT" \
              "$BASE/execute/Fileman/save_file_content" 2>/dev/null || echo '{"errors":["curl failed"]}')
            echo "$RESULT"
          done

          # Simpan SHA saat ini sebagai last deploy
          CURRENT_SHA=$(git rev-parse HEAD)
          curl -sk --max-time 15 \
            -H "$AUTH" \
            --data-urlencode "dir=$HOME_DIR/public_html" \
            --data-urlencode "file=.last-deploy-sha" \
            --data-urlencode "content=$CURRENT_SHA" \
            "$BASE/execute/Fileman/save_file_content" > /dev/null || true

      # ─── 6. Drop route cache file (never write empty return []) ───
      # Empty routes-v7.php makes Laravel think routes are cached → site-wide 404
      - name: Delete routes cache file
        run: |
          BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"
          HOME_DIR="/home/${{ secrets.CPANEL_USERNAME }}"
          SRC="$HOME_DIR/public_html/bootstrap/cache/routes-v7.php"

          echo "Unlink $SRC (if present)..."
          curl -sk --max-time 15 -H "$AUTH" \
            --data-urlencode "op=unlink" \
            --data-urlencode "sourcefiles=$SRC" \
            "$BASE/execute/Fileman/fileop" || true
          echo "Done."
