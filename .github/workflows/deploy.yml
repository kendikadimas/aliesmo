name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy critical files
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Skip npm build — maintenance is Blade, not SPA. Re-add when storefront reopens.
      - name: Deploy via cPanel UAPI (POST save_file_content)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, sys, urllib.parse, urllib.request, ssl
          from pathlib import Path

          host = os.environ["CPANEL_HOST"].replace("https://", "").replace("http://", "").split("/")[0].split(":")[0]
          user = os.environ["CPANEL_USERNAME"]
          token = os.environ["CPANEL_API_TOKEN"]
          auth = f"cpanel {user}:{token}"
          base = f"https://{host}:2083/execute"
          ctx = ssl.create_default_context()

          def uapi_get(path, params=None, timeout=20):
              url = f"{base}/{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"Authorization": auth})
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  return json.loads(r.read().decode())

          def uapi_post(path, fields, timeout=45):
              # POST application/x-www-form-urlencoded — content in body, not URL
              data = urllib.parse.urlencode(fields).encode("utf-8")
              req = urllib.request.Request(
                  f"{base}/{path}",
                  data=data,
                  headers={
                      "Authorization": auth,
                      "Content-Type": "application/x-www-form-urlencoded",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  return json.loads(r.read().decode())

          print(f"host={host} user={user}", flush=True)
          info = uapi_get("Variables/get_user_information", timeout=20)
          home = (info.get("data") or {}).get("home") or (info.get("data") or {}).get("homedir") or f"/home/{user}"
          print(f"home={home}", flush=True)

          listing = uapi_get("Fileman/list_files", {"dir": home}, timeout=20)
          names = [
              e.get("file")
              for e in (listing.get("data") or [])
              if e.get("type") == "dir" and (e.get("file") or "").lower().startswith("aliesmo")
          ]
          app_name = "aliesmo" if "aliesmo" in names else (sorted(names)[0] if names else None)
          if not app_name:
              print("FAIL no aliesmo* dir", json.dumps(listing)[:400], flush=True)
              sys.exit(1)

          app_dir = f"{home}/{app_name}"
          pub_dir = f"{home}/public_html"
          print(f"APP_DIR={app_dir}", flush=True)

          # Minimum for maintenance live + label. Binaries/assets later.
          files = [
              ("routes/web.php", f"{app_dir}/routes", "web.php"),
              ("resources/views/maintenance.blade.php", f"{app_dir}/resources/views", "maintenance.blade.php"),
              ("resources/views/shipping-label.blade.php", f"{app_dir}/resources/views", "shipping-label.blade.php"),
              ("app/Http/Controllers/ShippingLabelController.php", f"{app_dir}/app/Http/Controllers", "ShippingLabelController.php"),
              ("public/deploy-runner.php", pub_dir, "deploy-runner.php"),
          ]

          fail = 0
          for local, rdir, fname in files:
              p = Path(local)
              if not p.is_file():
                  print(f"skip {local}", flush=True)
                  continue
              content = p.read_text(encoding="utf-8")
              try:
                  uapi_post("Fileman/mkdir", {"path": rdir, "permissions": "0755"}, timeout=15)
              except Exception:
                  pass
              print(f"SAVE {local} ({len(content)} chars) ", end="", flush=True)
              try:
                  res = uapi_post(
                      "Fileman/save_file_content",
                      {"dir": rdir, "file": fname, "content": content, "fallback": "1"},
                      timeout=40,
                  )
                  if res.get("status") == 1:
                      print("OK", flush=True)
                  else:
                      # alternate: filepath
                      res2 = uapi_post(
                          "Fileman/save_file_content",
                          {"filepath": f"{rdir}/{fname}", "content": content},
                          timeout=40,
                      )
                      if res2.get("status") == 1:
                          print("OK(filepath)", flush=True)
                      else:
                          print("FAIL", json.dumps(res)[:180], json.dumps(res2)[:180], flush=True)
                          fail = 1
              except Exception as e:
                  print(f"FAIL {e}", flush=True)
                  fail = 1

          if fail:
              sys.exit(1)
          print("All OK", flush=True)
          PY

      - name: Verify maintenance live
        run: |
          set -e
          sleep 3
          curl -sS --connect-timeout 15 --max-time 30 -o /tmp/home.html "https://aliesmo.id/" || true
          if grep -qiE 'pemeliharaan|Maintenance|sedang dalam' /tmp/home.html; then
            echo "VERIFY OK: maintenance page live"
            exit 0
          fi
          echo "VERIFY FAIL"
          head -c 600 /tmp/home.html || true
          exit 1
