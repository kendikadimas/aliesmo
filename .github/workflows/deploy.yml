name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # ─── 2. Setup Node & build assets ──────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ─── 3. Commit build artifacts ke repo ────────────────────────────
      - name: Commit public/build ke repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/build
          git diff --cached --quiet || git commit -m "deploy: build artifacts [skip ci]"
          git push origin main

      # ─── 4. Fetch via cPanel Git Version Control ──────────────────
      - name: Fetch via cPanel Git VC
        run: |
          BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"
          REPO_ROOT="/home/${{ secrets.CPANEL_USERNAME }}/public_html"
          curl -s --max-time 60 -H "$AUTH" \
            "$BASE/execute/VersionControl/update?repository_root=$REPO_ROOT" || true

      # ─── 5. Upload PHP/blade (multipart + retry; never advance SHA on fail)
      - name: Upload PHP/blade files to server
        run: |
          set -euo pipefail
          BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"
          HOME_DIR="/home/${{ secrets.CPANEL_USERNAME }}"
          ROOT="$HOME_DIR/public_html"

          LAST_SHA=""
          LAST_SHA_RESPONSE=$(curl -sk --max-time 15 -H "$AUTH" \
            "$BASE/execute/Fileman/get_file_content?dir=%2F${HOME_DIR#/}%2Fpublic_html&file=.last-deploy-sha" 2>/dev/null || true)
          LAST_SHA=$(echo "$LAST_SHA_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('data') or {}).get('content','').strip())" 2>/dev/null || true)

          if [ -n "$LAST_SHA" ] && git cat-file -e "$LAST_SHA^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$LAST_SHA" HEAD -- '*.php' '*.blade.php' 2>/dev/null || true)
            echo "Diffing from $LAST_SHA to HEAD"
          else
            CHANGED=$(git diff --name-only HEAD~5 HEAD -- '*.php' '*.blade.php' 2>/dev/null || true)
            echo "No valid last SHA — using HEAD~5..HEAD"
          fi

          # Always force critical paths (Git VC deployable:0 + past Fileman timeouts)
          FORCE="bootstrap/app.php public/index.php routes/web.php app/Http/Controllers/ShippingLabelController.php resources/views/shipping-label.blade.php app/Filament/Resources/OrderResource.php app/Filament/Widgets/OrdersWidget.php app/Providers/Filament/AdminPanelProvider.php bootstrap/cache/services.php bootstrap/cache/packages.php"

          # Unique list
          FILES=$(printf '%s\n%s\n' $FORCE $CHANGED | awk 'NF && !seen[$0]++')
          echo "Upload queue:"
          echo "$FILES"

          upload_one() {
            local FILE="$1"
            [ -f "$FILE" ] || { echo "skip missing $FILE"; return 0; }
            local DIR="$ROOT/$(dirname "$FILE")"
            local NAME
            NAME=$(basename "$FILE")
            local attempt=1
            while [ "$attempt" -le 4 ]; do
              echo "Saving $FILE (try $attempt)..."
              # multipart avoids huge urlencoded bodies timing out
              RESULT=$(curl -sk --max-time 180 -H "$AUTH" \
                -F "dir=$DIR" \
                -F "file=$NAME" \
                -F "content=<$FILE" \
                "$BASE/execute/Fileman/save_file_content" 2>/dev/null || echo '{"errors":["curl failed"]}')
              echo "$RESULT"
              if echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('status')==1 else 1)" 2>/dev/null; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            echo "FAILED: $FILE"
            return 1
          }

          FAIL=0
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            upload_one "$FILE" || FAIL=1
          done <<< "$FILES"

          if [ "$FAIL" -ne 0 ]; then
            echo "One or more uploads failed — NOT updating .last-deploy-sha"
            exit 1
          fi

          CURRENT_SHA=$(git rev-parse HEAD)
          curl -sk --max-time 30 -H "$AUTH" \
            -F "dir=$ROOT" \
            -F "file=.last-deploy-sha" \
            -F "content=$CURRENT_SHA" \
            "$BASE/execute/Fileman/save_file_content" > /dev/null || true
          echo "Deployed SHA $CURRENT_SHA"

      # ─── 6. Neutralize empty/broken routes-v7.php ───
      - name: Self-delete broken routes cache
        run: |
          BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"
          HOME_DIR="/home/${{ secrets.CPANEL_USERNAME }}"
          STUB=$'<?php @unlink(__FILE__);\n'

          echo "Overwrite routes-v7.php with self-delete stub..."
          RESULT=$(curl -sk --max-time 30 -H "$AUTH" \
            -F "dir=$HOME_DIR/public_html/bootstrap/cache" \
            -F "file=routes-v7.php" \
            -F "content=$STUB" \
            "$BASE/execute/Fileman/save_file_content" || echo '{"errors":["curl failed"]}')
          echo "$RESULT"

          echo "Warm requests..."
          curl -sk --max-time 20 -o /dev/null -w "HTTP %{http_code}\n" "https://aliesmo.id/" || true
          curl -sk --max-time 20 -o /dev/null -w "HTTP %{http_code}\n" "https://aliesmo.id/" || true
          curl -sk --max-time 20 -o /dev/null -w "HTTP /up %{http_code}\n" "https://aliesmo.id/up" || true
