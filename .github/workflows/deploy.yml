name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Commit public/build ke repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/build
          git diff --cached --quiet || git commit -m "deploy: build artifacts [skip ci]"
          git push origin main

      # cPanel Fileman UAPI diblok bot-protection dari GitHub IP.
      # Deploy via public/deploy-runner.php (zip + DEPLOY_TOKEN).
      - name: Zip & upload via deploy-runner
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "DEPLOY_TOKEN secret missing"
            exit 1
          fi

          LAST_SHA_FILE=".last-deploy-sha.local"
          # force critical files every run (Git VC deployable:0)
          FORCE=(
            bootstrap/app.php
            public/index.php
            public/deploy-runner.php
            routes/web.php
            app/Http/Controllers/ShippingLabelController.php
            resources/views/shipping-label.blade.php
            app/Filament/Resources/OrderResource.php
            app/Filament/Widgets/OrdersWidget.php
            app/Providers/Filament/AdminPanelProvider.php
          )

          # also any php/blade changed in last 15 commits (catch backlog)
          mapfile -t RECENT < <(git log --name-only --pretty=format: -n 15 -- '*.php' '*.blade.php' | awk 'NF && !seen[$0]++')

          FILES=()
          for f in "${FORCE[@]}" "${RECENT[@]}"; do
            [ -f "$f" ] || continue
            case "$f" in
              vendor/*|node_modules/*|storage/*|bootstrap/cache/*) continue ;;
            esac
            FILES+=("$f")
          done

          # unique
          mapfile -t FILES < <(printf '%s\n' "${FILES[@]}" | awk 'NF && !seen[$0]++')

          echo "Packing ${#FILES[@]} files..."
          printf '%s\n' "${FILES[@]}"
          rm -f deploy-payload.zip
          zip -q deploy-payload.zip "${FILES[@]}"
          ls -la deploy-payload.zip

          RESP=$(curl -sk --max-time 180 \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -F "deploy_zip=@deploy-payload.zip" \
            "https://aliesmo.id/deploy-runner.php")
          echo "$RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('success') is True, d"

          curl -sk --max-time 20 -o /dev/null -w "HOME %{http_code}\n" "https://aliesmo.id/" || true
          curl -sk --max-time 20 -o /dev/null -w "UP %{http_code}\n" "https://aliesmo.id/up" || true
