name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Commit public/build ke repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/build
          git diff --cached --quiet || git commit -m "deploy: build artifacts [skip ci]"
          git push origin main

      # Fileman UAPI blocked by bot-protection from GitHub IP.
      # FTP: only critical files, short timeout, fail fast.
      - name: FTP upload label + routes (critical)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          FILES=(
            routes/web.php
            app/Http/Controllers/ShippingLabelController.php
            resources/views/shipping-label.blade.php
            app/Filament/Resources/OrderResource.php
            public/index.php
            public/deploy-runner.php
            bootstrap/app.php
          )

          echo "FTP host=$FTP_SERVER user=$FTP_USERNAME"
          FAIL=0
          for f in "${FILES[@]}"; do
            [ -f "$f" ] || { echo "missing $f"; FAIL=1; continue; }
            echo "PUT $f"
            # cPanel often wants path under public_html; try both with/without public_html prefix
            OK=0
            for REMOTE in \
              "ftp://$FTP_SERVER/public_html/$f" \
              "ftp://$FTP_SERVER/$f"
            do
              if curl -sS --connect-timeout 15 --max-time 45 --ftp-create-dirs \
                  --user "$FTP_USERNAME:$FTP_PASSWORD" \
                  -T "$f" "$REMOTE" 2>/tmp/ftp.err; then
                echo "  OK $REMOTE"
                OK=1
                break
              fi
            done
            if [ "$OK" -ne 1 ]; then
              echo "  FAIL $f"
              cat /tmp/ftp.err || true
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ]

      - name: Warm site
        run: |
          curl -sk --max-time 15 -o /dev/null -w "HOME %{http_code}\n" "https://aliesmo.id/" || true
          curl -sk --max-time 15 -o /dev/null -w "UP %{http_code}\n" "https://aliesmo.id/up" || true
