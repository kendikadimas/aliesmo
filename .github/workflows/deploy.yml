name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --include=prod
        working-directory: frontend

      - name: Build assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy via cPanel UAPI
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          HOST="${CPANEL_HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"
          USER="${CPANEL_USERNAME}"
          TOKEN="${CPANEL_API_TOKEN}"
          AUTH="Authorization: cpanel ${USER}:${TOKEN}"
          BASE="https://${HOST}:2083/execute"
          echo "host=$HOST user=$USER"

          INFO=$(curl -sS --connect-timeout 20 --max-time 45 -H "$AUTH" "${BASE}/Variables/get_user_information")
          HOME_DIR=$(php -r '$j=json_decode(stream_get_contents(STDIN),true); echo $j["data"]["home"]??$j["data"]["homedir"]??"";' <<<"$INFO")
          if [ -z "$HOME_DIR" ]; then HOME_DIR="/home/${USER}"; fi
          echo "home=$HOME_DIR"

          LIST=$(curl -sS --connect-timeout 20 --max-time 45 -H "$AUTH" --get --data-urlencode "dir=${HOME_DIR}" "${BASE}/Fileman/list_files" || true)
          APP_NAME=$(php -r '
            $j=json_decode(stream_get_contents(STDIN),true);
            $c=[];
            foreach (($j["data"] ?? []) as $e) {
              if (($e["type"] ?? "") !== "dir") continue;
              $n = $e["file"] ?? "";
              if ($n === "aliesmo" || preg_match("/^aliesmo/i", $n)) $c[] = $n;
            }
            if (in_array("aliesmo", $c, true)) { echo "aliesmo"; exit; }
            sort($c);
            echo $c[0] ?? "";
          ' <<<"$LIST")
          if [ -z "$APP_NAME" ]; then
            echo "FAIL: no aliesmo* directory"
            echo "$LIST" | head -c 800
            exit 1
          fi
          APP_DIR="${HOME_DIR}/${APP_NAME}"
          PUB_DIR="${HOME_DIR}/public_html"
          echo "APP_DIR=$APP_DIR"
          echo "PUB_DIR=$PUB_DIR"

          upload() {
            local local_path="$1"
            local rdir="$2"
            local base
            base=$(basename "$local_path")
            if [ ! -f "$local_path" ]; then
              echo "skip missing $local_path"
              return 0
            fi
            curl -sS --connect-timeout 15 --max-time 20 -H "$AUTH" --get \
              --data-urlencode "path=${rdir}" \
              --data-urlencode "permissions=0755" \
              "${BASE}/Fileman/mkdir" >/dev/null 2>&1 || true
            echo -n "PUT $local_path -> $rdir/ "
            RES=$(curl -sS --connect-timeout 20 --max-time 60 \
              -H "$AUTH" \
              -F "dir=${rdir}" \
              -F "file-1=@${local_path};filename=${base}" \
              "${BASE}/Fileman/upload_files" || echo '{"status":0}')
            if echo "$RES" | grep -qE '"status"[[:space:]]*:[[:space:]]*1'; then
              echo OK
              return 0
            fi
            echo FAIL
            echo "$RES" | head -c 300
            echo
            return 1
          }

          FAIL=0
          upload "routes/web.php" "${APP_DIR}/routes" || FAIL=1
          upload "routes/api.php" "${APP_DIR}/routes" || FAIL=1
          upload "resources/views/maintenance.blade.php" "${APP_DIR}/resources/views" || FAIL=1
          upload "resources/views/shipping-label.blade.php" "${APP_DIR}/resources/views" || FAIL=1
          upload "app/Http/Controllers/ShippingLabelController.php" "${APP_DIR}/app/Http/Controllers" || FAIL=1
          upload "app/Http/Middleware/SecurityHeaders.php" "${APP_DIR}/app/Http/Middleware" || FAIL=1
          upload "app/Filament/Resources/OrderResource.php" "${APP_DIR}/app/Filament/Resources" || FAIL=1
          upload "app/Filament/Widgets/OrdersWidget.php" "${APP_DIR}/app/Filament/Widgets" || FAIL=1
          upload "app/Filament/Widgets/ProductsWidget.php" "${APP_DIR}/app/Filament/Widgets" || FAIL=1
          upload "app/Filament/Widgets/ReviewsWidget.php" "${APP_DIR}/app/Filament/Widgets" || FAIL=1
          upload "app/Filament/Widgets/UsersWidget.php" "${APP_DIR}/app/Filament/Widgets" || FAIL=1
          upload "config/cors.php" "${APP_DIR}/config" || FAIL=1
          upload "public/deploy-runner.php" "${PUB_DIR}" || FAIL=1
          upload "public/js/JsBarcode.all.min.js" "${PUB_DIR}/js" || FAIL=1
          upload "public/jnt-express-logo.svg" "${PUB_DIR}" || FAIL=1
          upload "public/New_Logo_JNE.png" "${PUB_DIR}" || FAIL=1
          upload "public/POSIND_2023.svg" "${PUB_DIR}" || FAIL=1
          upload "public/build/manifest.json" "${PUB_DIR}/build" || FAIL=1
          for f in public/build/assets/*; do
            [ -f "$f" ] || continue
            upload "$f" "${PUB_DIR}/build/assets" || FAIL=1
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "Some uploads failed"
            exit 1
          fi
          echo "All uploads OK"

      - name: Verify maintenance live
        run: |
          set -e
          sleep 2
          curl -sS --connect-timeout 15 --max-time 30 -o /tmp/home.html "https://aliesmo.id/" || true
          if grep -qiE 'pemeliharaan|Maintenance|sedang dalam' /tmp/home.html; then
            echo "VERIFY OK: maintenance page live"
            exit 0
          fi
          echo "VERIFY FAIL"
          head -c 500 /tmp/home.html
          exit 1
